_metadata:
  major_version: 1
display_information:
  name: Thunder Bolt App
functions:
  demo_format_message:
    title: Format a message
    description: Demonstrates a protected Tempest async custom-function handoff.
    input_parameters:
      message:
        type: string
        title: Message
        description: The message to format.
        is_required: true
    output_parameters:
      message:
        type: string
        title: Formatted message
        description: The formatted message.
        is_required: true
features:
  app_home:
    home_tab_enabled: true
  bot_user:
    display_name: Thunder Bolt
  shortcuts:
    - name: Open request
      type: global
      callback_id: open_request_modal
      description: Start a request with an optional assignee
  slash_commands:
    - command: /kickensink
      description: Tour Thunder with interactive cards and a stoppable agent session
      should_escape: false
    - command: /kitchensink
      description: Alias for the Thunder kitchen-sink tour
      should_escape: false
    - command: /bolt
      description: Run the pet, terminal, AI, or work-item demo
      usage_hint: pet | terminal | ai your question | work title
      should_escape: false
    - command: /ping
      url: https://example.test/slack/events
      description: Reply with Pong
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - chat:write
      - commands
      - im:history
      - links:read
      - links:write
settings:
  # Set true before running `bolt socket:serve`; HTTP remains the default transport.
  socket_mode_enabled: false
  interactivity:
    is_enabled: true
    request_url: https://example.test/slack/events
  event_subscriptions:
    request_url: https://example.test/slack/events
    bot_events:
      - app_home_opened
      - app_mention
      - assistant_thread_started
      - assistant_thread_context_changed
      - agent_session_stopped
      - agent_session_title_changed
      - message.im
      - entity_details_requested
      - entity_comments_requested
      - function_executed
      - link_shared
