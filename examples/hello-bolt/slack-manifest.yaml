_metadata:
  major_version: 1
display_information:
  name: Thunder Bolt App
features:
  app_home:
    home_tab_enabled: true
  bot_user:
    display_name: Thunder Bolt
  shortcuts:
    - name: Open request
      type: global
      callback_id: open_request_modal
      description: Start a request with an optional assignee
  slash_commands:
    - command: /bolt
      description: Run the pet, terminal, AI, or work-item demo
      usage_hint: pet | terminal | ai your question | work title
      should_escape: false
    - command: /ping
      url: https://example.test/slack/events
      description: Reply with Pong
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - chat:write
      - commands
      - im:history
      - links:read
      - links:write
settings:
  # Set true before running `bolt socket:serve`; HTTP remains the default transport.
  socket_mode_enabled: false
  interactivity:
    is_enabled: true
    request_url: https://example.test/slack/events
  event_subscriptions:
    request_url: https://example.test/slack/events
    bot_events:
      - app_home_opened
      - app_mention
      - assistant_thread_started
      - assistant_thread_context_changed
      - message.im
      - entity_details_requested
      - entity_comments_requested
      - link_shared
