version = "1.50.0"
php-version = "8.5"

[source]
paths = ["src", "tests", "examples/hello-bolt/app", "examples/hello-bolt/public", "examples/deployment/app", "examples/deployment/config"]
includes = ["vendor"]
excludes = ["work/**", "examples/**/vendor/**", "vendor/**/vendor/**", "src/Scaffold/**"]

[formatter]
excludes = ["src/Generated/**", "src/Scaffold/**"]

[linter]
excludes = ["tests/**"]

# Formatting and IDE inspection already cover these mechanical preferences. They
# add churn to fluent builders, framework calls, and deterministic SDK output;
# Mago remains responsible for correctness, safety, and PHP semantics.
[linter.rules.block-statement]
enabled = false

[linter.rules.explicit-octal]
enabled = false

[linter.rules.cyclomatic-complexity]
enabled = false

[linter.rules.excessive-parameter-list]
enabled = false

[linter.rules.halstead]
enabled = false

[linter.rules.kan-defect]
enabled = false

[linter.rules.literal-named-argument]
enabled = false

[linter.rules.no-else-clause]
enabled = false

[linter.rules.no-isset]
enabled = false

[linter.rules.no-redundant-use]
enabled = false

[linter.rules.no-shorthand-ternary]
enabled = false

[linter.rules.readable-literal]
enabled = false

[linter.rules.too-many-methods]
enabled = false

[analyzer]
excludes = ["src/Scaffold/**", "tests/**"]
